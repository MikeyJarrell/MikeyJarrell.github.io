- title: "Who's in Charge? Reducing Pollution from Lead Battery Repair"
  pdflink: "/pdf/snitching.pdf"
  book:
  coauthors: Nathan Lazarus
  links:
    - url:
      text:
  abstract: >
    How can an externality from a polluting activity be internalized when not even the internality from same activity is being internalized? Battery technicians (people who repair lead-acid batteries) are a ubiquitous but understudied presence in poor countries. Existing evidence suggests that battery technicians create substantial amounts of lead pollution, causing lead poisoning for themselves and for others, including family members or people who live or work nearby. Technicians, and the community at large, appear to be unaware of this fact. We propose an information intervention to improve safety practices of battery technicians in Lagos, Nigeria.

- title: "Lead Pollution and Exposure from Battery Recycling Firms in Nigeria"
  pdflink:
  book:
  coauthors: "Sifau Adejumo, Gilbert Adie, Rose Alani, Nathan Lazarus, Mary Ogundiran, and Oluseye Vincent Osunkalu"
  links:
    - url:
      text:
  abstract: >
    We measure lead pollution and blood lead levels at formal and informal recycling and battery breaking operations in Nigeria to quantify the extent of contamination and characterize its dispersion.

- title: "Brazilian Battery Boom: Tax Breaks as Anti-Pollution Policy"
  pdflink: "/pdf/brazil.pdf"
  book:
  coauthors: Nathan Lazarus and David Vargas
  links:
    - url:
      text:
  abstract: >
    In 2005, Brazil began an ambitious attempt at regulating a high-polluting industry: lead-acid battery recycling. They implemented tax breaks for formal (less-polluting) recycling firms, and drove their informal competitors out of business with verification requirements. This led to a centralization of lead battery recycling in a few municipalities that were home to formal recycling factories, increasing their exposure to lead emissions from these factories, which is associated with adverse consequences for children's cognition. Our preliminary results show that the tax break caused a divergence in elementary school student performance between municipalities that did have these factories and those that did not. This supports the hypothesis that lead pollution fell across the country as informal recycling disappeared, while pollution increased near formal firms as those expanded. We are currently incorporating matched employer--employee data from the Relação Anual de Informações Sociais (RAIS), which allows us to estimate a first stage (how much recycling firms grew) and provide some of the first evidence on the effects of lead exposure as a child or young adult on labor market outcomes. Additionally, we are in the process of incorporating data on birth outcomes, which will give us a more direct measure of health impacts. We are hopeful that these additional results will paint a complete picture of the effects of this policy change and allow us to judge whether the template created by Brazil should be copied by the many other countries facing this challenge.

- title: "Beijing Battery Bust: Was China's Crackdown on Lead Battery Firms Worth It?"
  pdflink:
  book:
  coauthors: Hugo Smith and Linxi Wang
  links:
    - url:
      text:
  abstract: >
    In the history of the developing world, by far the largest intervention intended to reduce lead exposure is China's 2011 crackdown on the lead-acid battery industry, which permanently shut down hundreds of firms throughout the country virtually overnight. The health benefits from these shutdowns may have been tremendous; however, if targeting were done poorly, the intervention could have accomplished very little or even completely backfired. Overall, how do the benefits compare to the costs of this crackdown? To answer this question, we create a novel dataset on the universe of lead battery firms at the time of the crackdown, including their locations and whether they were shut down or allowed to continue operations. We hope to link this dataset to relevant outcomes to estimate the causal effect of the crackdown on health. Back-of-the-envelope calculations value the expected benefit at $8 billion per year.
